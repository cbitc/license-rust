[package]
name = "license-sdk"
version = "0.1.0"
edition = "2024"
publish = false
repository = "http://192.168.1.252:3000/cbitc/license-sdk-rust"
description = "License Rust SDK"

[dependencies]
jsonwebtoken = { version = "9.3.1" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
time = "0.3"
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3"
