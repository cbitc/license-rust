[package]
name = "license-sdk"
version = "0.2.0"
edition = "2024"
publish = false
repository = "http://192.168.1.252:3000/cbitc/license-sdk-rust"
description = "License Rust SDK"

[dependencies]
base64 = "0.22"
directories = "6"
ed25519-dalek = "2"
hex = "0.4"
hostname = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
